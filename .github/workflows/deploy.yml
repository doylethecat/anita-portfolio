# Build and Deploy to GitHub Pages
name: Deploy

on:
  push:
    branches:
      - main  # 👈 ตรวจสอบว่า branch หลักของคุณคือ main หรือ master

# Opt into Node.js 24 for JavaScript-based actions to avoid Node 20 deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# ให้สิทธิ์ในการเขียน GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้มีการรันเพียง 1 Workflow ในครั้งเดียว
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job สำหรับการ Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Show build output (debug)
        run: |
          echo "== dist listing =="
          ls -la ./dist
          echo "\n== dist/index.html (first 200 lines) =="
          sed -n '1,200p' ./dist/index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # If the repository doesn't have a Pages site yet, enablement:true will create/configure it.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # โฟลเดอร์ที่ได้จากการ build สำหรับ Vite คือ 'dist'
          path: './dist'

  # Job สำหรับการ Deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for Pages to propagate
        run: |
          echo "Waiting 10s for GitHub Pages to propagate..."
          sleep 10

      - name: Check deployed Pages URL
        run: |
          URL="https://doylethecat.github.io/anita-portfolio/"
          echo "Checking $URL"
          echo "HTTP status (follow redirects):"
          curl -I -L -s -o /dev/null -w "%{http_code}\n" "$URL" || true
          echo "\nFirst 200 lines of response body:" 
          curl -s "$URL" | sed -n '1,200p' || true
